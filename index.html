        <span class="reader-eyebrow">READING ROOM / 静心阅读</span>
        <button type="button" id="mobile-back-btn" class="mobile-back-btn" aria-label="返回文章列表">← 返回藏文</button>
        <div class="reader-actions"><button type="button" id="focus-reading-btn" class="reading-button" aria-pressed="false">专注阅读</button></div>
      </div>
      <div class="reader-container" id="reader-container">
        <div id="reader-content">
          <div class="empty-state">
            <div class="empty-title">请选择一篇文章阅读</div>
            <div class="empty-desc">在左侧列表中点击任意文章即可开始阅读</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Embedded JSON Data -->
  <script id="archive-data" type="application/json">
[]
  </script>
  <script id="labels-data" type="application/json">
{}
  </script>

  <!-- Offline Application Logic -->
  <script>
    (function() {
      const encryptedMode = document.documentElement.getAttribute('data-ca-encrypted') === '1';
      // Parse embedded data (offline build). Encrypted entries embed [] and are
      // populated only after the browser unlock hook calls CAContentArchive.boot().
      const dataEl = document.getElementById('archive-data');
      const labelsEl = document.getElementById('labels-data');
      let articles = [];
      let labels = {};
      let renderEpoch = 0;

      function readEmbeddedData() {
        try {
          articles = JSON.parse((dataEl && dataEl.textContent) || '[]');
        } catch (e) {
          console.error('Failed to parse archive data:', e);
          articles = [];
        }

        try {
          labels = JSON.parse((labelsEl && labelsEl.textContent) || '{}');
        } catch (e) {
          console.error('Failed to parse labels data:', e);
          labels = {};
        }
      }

      if (!encryptedMode) readEmbeddedData();

      // State
      const state = {
        tab: 'all',
        category: 'all',
        source: 'all',
        query: '',
        selectedId: null,
      };

      // Elements
      const appLayout = document.getElementById('app-layout');
      const searchInput = document.getElementById('search-input');
      const searchClearBtn = document.getElementById('search-clear-btn');
      const categoryFilter = document.getElementById('category-filter');
      const sourceFilter = document.getElementById('source-filter');
      const resetFiltersBtn = document.getElementById('reset-filters-btn');
      const filteredStatus = document.getElementById('filtered-status');
      const articleListEl = document.getElementById('article-list');
      const readerContentEl = document.getElementById('reader-content');
      const mobileBackBtn = document.getElementById('mobile-back-btn');
      const tabAll = document.getElementById('tab-all');
      const tabManual = document.getElementById('tab-manual');
      const tabAuto = document.getElementById('tab-auto');
      const totalCountBadge = document.getElementById('total-count-badge');

      // Helper: Escape HTML
      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Helper: Validate external http(s) URL
      function isValidHttpUrl(url) {
        if (!url || typeof url !== 'string') return false;
        if (/[\x00-\x1f\x7f]/.test(url)) return false;
        try {
          const u = new URL(url);
          return (u.protocol === 'http:' || u.protocol === 'https:') && Boolean(u.hostname);
        } catch (e) {
          return false;
        }
      }

      // Initialize Collection Counts
      function updateCollectionCounts() {
        const total = articles.length;
        const manual = articles.filter(a => a.collection === 'manual').length;
        const auto = articles.filter(a => a.collection === 'auto').length;

        document.getElementById('count-all').textContent = total;
        document.getElementById('count-manual').textContent = manual;
        document.getElementById('count-auto').textContent = auto;
        if (totalCountBadge) {
          totalCountBadge.textContent = '共 ' + total + ' 篇';
        }
      }

      // Initialize Filter Options
      function initFilterOptions() {
        // Category options
        const catMap = new Map();
        for (const a of articles) {
          const cat = a.category || 'other';
          catMap.set(cat, (catMap.get(cat) || 0) + 1);
        }
        for (const [cat, count] of catMap.entries()) {
          const opt = document.createElement('option');
          opt.value = cat;
          const label = labels[cat] || cat;
          opt.textContent = `${label} (${count})`;
          categoryFilter.appendChild(opt);
        }

        // Source options
        const srcMap = new Map();
        for (const a of articles) {
          const src = a.source || '其他';
          srcMap.set(src, (srcMap.get(src) || 0) + 1);
        }
        const sortedSources = Array.from(srcMap.entries()).sort((a, b) => b[1] - a[1]);
        for (const [src, count] of sortedSources) {
          const opt = document.createElement('option');
          opt.value = src;
          opt.textContent = `${src} (${count})`;
          sourceFilter.appendChild(opt);
        }
      }

      // Filter articles based on state
      function filterArticles() {
        const q = state.query.trim().toLowerCase();
        return articles.filter(a => {
          if (state.tab === 'manual' && a.collection !== 'manual') return false;
          if (state.tab === 'auto' && a.collection !== 'auto') return false;
          if (state.category !== 'all' && a.category !== state.category) return false;
          if (state.source !== 'all' && a.source !== state.source) return false;
          if (q && !(a.search_text && a.search_text.includes(q))) return false;
          return true;
        });
      }

      // Render the article list
      function renderList() {
        const filtered = filterArticles();
        const hasFilters = state.tab !== 'all' || state.category !== 'all' || state.source !== 'all' || state.query.trim() !== '';
        resetFiltersBtn.style.display = hasFilters ? 'inline-block' : 'none';
        filteredStatus.textContent = `显示 ${filtered.length} / ${articles.length} 篇`;

        if (filtered.length === 0) {
          articleListEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-title">没有找到匹配的文章</div>
              <div class="empty-desc">请尝试调整搜索关键词或重置筛选</div>
              <button type="button" class="btn-reset" id="empty-reset-btn">重置筛选条件</button>
            </div>
          `;
          const emptyBtn = document.getElementById('empty-reset-btn');
          if (emptyBtn) emptyBtn.addEventListener('click', resetAllFilters);
          renderReader(null);
          return;
        }

        // Render Cards
        const cardsHtml = filtered.map(a => {
          const isSelected = a.id === state.selectedId;
          let colBadge = '';
          if (a.collection === 'manual') {
            colBadge = '<span class="badge badge-manual">手动</span>';
          } else if (a.collection === 'auto') {
            colBadge = '<span class="badge badge-auto">自动</span>';
          } else {
            colBadge = '<span class="badge badge-unlabeled">未标记</span>';
          }

          const partialBadge = a.status === 'partial' ? '<span class="badge-mini badge-partial">部分</span>' : '';
          const dateStr = a.published_unknown ? '日期未知' : (a.published || '日期未知');
          const catLabel = a.category_label || labels[a.category] || a.category || '';

          return `
            <div
              class="article-card ${isSelected ? 'active' : ''}"
              data-id="${escapeHtml(a.id)}"
              role="button"
              tabindex="0"
              aria-pressed="${isSelected}"
            >
              <div class="card-kicker"><span class="card-category">${escapeHtml(catLabel)}</span><time title="发布日期">发布 ${escapeHtml(dateStr)}</time></div>
              <h3 class="card-title">${escapeHtml(a.title)}</h3>
              ${a.summary ? `<p class="card-summary">${escapeHtml(a.summary)}</p>` : ''}
              <div class="card-meta">
                <span class="meta-source">${escapeHtml(a.source)}</span><span class="meta-separator" aria-hidden="true">·</span>${colBadge}${partialBadge}
              </div>
            </div>
          `;
        }).join('');

        articleListEl.innerHTML = cardsHtml;

        // Attach Card Click Events
        const cards = articleListEl.querySelectorAll('.article-card');
        cards.forEach(card => {
          const id = card.getAttribute('data-id');
          card.addEventListener('click', () => selectArticle(id));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              selectArticle(id);
            }
          });
        });

        // Ensure active selection
        const stillInFiltered = filtered.some(a => a.id === state.selectedId);
        if (!stillInFiltered) {
          if (window.innerWidth > 820 && filtered.length > 0) {
            selectArticle(filtered[0].id, false);
          } else {
            renderReader(null);
          }
        }
      }

      // Render Selected Article in Reader
      function renderReader(id) {
        renderEpoch += 1;
        const epoch = renderEpoch;
        if (!id) {
          readerContentEl.innerHTML = `
            <div class="empty-state">
              <div class="empty-title">请选择一篇文章阅读</div>
              <div class="empty-desc">在左侧列表中点击任意文章即可开始阅读</div>
            </div>
          `;
          return;
        }

        const article = articles.find(a => a.id === id);
        if (!article) return;

        // Badges
        let colBadge = '';
        if (article.collection === 'manual') {
          colBadge = '<span class="badge badge-manual">手动收藏</span>';
        } else if (article.collection === 'auto') {
          colBadge = '<span class="badge badge-auto">自动归档</span>';
        } else {
          colBadge = '<span class="badge badge-unlabeled">未标记</span>';
        }

        const catLabel = article.category_label || labels[article.category] || article.category || '';
        const origTitleHtml = (article.original_title && article.original_title !== article.title)
          ? `<div class="article-original-title">${escapeHtml(article.original_title)}</div>`
          : '';

        // Alerts / Warnings
        let alertsHtml = '';
        if (article.status === 'partial') {
          alertsHtml += `<div class="alert-box alert-warning">⚠️ <strong>部分收录</strong>：本文章归档时仅获取到部分内容。${article.content_note ? '（' + escapeHtml(article.content_note) + '）' : ''}</div>`;
        }
        if (article.published_unknown) {
          alertsHtml += `<div class="alert-box alert-warning">⚠️ <strong>日期未知</strong>：原始发布日期无法准确解析。</div>`;
        }
        const notes = [];
        if (article.image_note) notes.push(`<p><strong>图片说明</strong>：${escapeHtml(article.image_note)}</p>`);
        if (article.content_note && article.status !== 'partial') notes.push(`<p><strong>内容说明</strong>：${escapeHtml(article.content_note)}</p>`);
        if (article.archived) notes.push(`<p>归档时间：${escapeHtml(article.archived)}</p>`);
        const notesHtml = notes.length ? `<details class="archive-notes"><summary>归档与图片说明${article.image_note ? ' · 含图片保存提示' : ''}</summary><div class="alert-box alert-info">${notes.join('')}</div></details>` : '';

        // External Link Button
        const extLinkHtml = (article.url && isValidHttpUrl(article.url))
          ? `<a href="${escapeHtml(article.url)}" class="btn-external" target="_blank" rel="noopener noreferrer">查看原文 ↗</a>`
          : '';

        // Summary Callout Box
        let summaryHtml = '';
        if (article.summary) {
          summaryHtml = `
            <div class="summary-callout">
              <div class="summary-callout-title">内容提要</div>
              <div class="summary-callout-text">${escapeHtml(article.summary)}</div>
            </div>
          `;
        }

        // Tags
        let tagsHtml = '';
        if (article.tags && article.tags.length > 0) {
          const chips = article.tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('');
          tagsHtml = `<div class="article-tags" aria-label="文章标签">${chips}</div>`;
        }

        // Header Meta Row
        const metaDateStr = article.published_unknown ? '⚠️ 日期未知' : escapeHtml(article.published || '未知');

        readerContentEl.innerHTML = `
          <article class="reader-article">
            <header class="article-header">
              <div class="article-kicker">${escapeHtml(catLabel)}<span aria-hidden="true">/</span>${colBadge}</div>
              <h1 class="article-title">${escapeHtml(article.title)}</h1>
              ${origTitleHtml}
              <div class="article-meta-bar">
                <span class="meta-chip"><strong>${escapeHtml(article.source || '未知')}</strong></span>
                <span class="meta-chip">发布于 ${metaDateStr}</span>
                ${extLinkHtml}
              </div>
            </header>

            ${alertsHtml}
            ${summaryHtml}
            <div class="reading-section-label">原文 / FULL TEXT</div>
            <div class="article-body">
              ${article.body_html || ''}
            </div>
            <footer class="article-footer">${tagsHtml}${notesHtml}</footer>
          </article>
        `;

        // Move the archive's duplicated source line into its provenance details.
        const sourceLine = readerContentEl.querySelector('.article-body > blockquote:first-child');
        const noteBody = readerContentEl.querySelector('.archive-notes .alert-box');
        if (sourceLine && noteBody && /^来源：/.test(sourceLine.textContent.trim()) && sourceLine.textContent.includes('发布：')) {
          noteBody.prepend(sourceLine);
        }
        // Optional encrypted/async body loader. Offline output has no hook and
        // keeps using the embedded body_html synchronously.
        const bodyEl = readerContentEl.querySelector('.article-body');
        if (bodyEl && window.CA_HOOKS && typeof window.CA_HOOKS.mountBody === 'function') {
          try {
            window.CA_HOOKS.mountBody(article, bodyEl, epoch);
          } catch (e) {
            console.error('Body loader failed:', e);
          }
        }
        // Scroll reader to top
        document.getElementById('reader-pane').scrollTop = 0;
      }

      // Select an article
      function selectArticle(id, switchMobile = true) {
        state.selectedId = id;

        // Highlight in list
        const cards = articleListEl.querySelectorAll('.article-card');
        cards.forEach(card => {
          const cardId = card.getAttribute('data-id');
          if (cardId === id) {
            card.classList.add('active');
            card.setAttribute('aria-pressed', 'true');
          } else {
            card.classList.remove('active');
            card.setAttribute('aria-pressed', 'false');
          }
        });

        renderReader(id);

        if (id) {
          try {
            history.replaceState(null, '', '#' + encodeURIComponent(id));
          } catch (e) {}
        }

        // On mobile, switch to reader view
        if (switchMobile && window.innerWidth <= 820 && id) {
          appLayout.classList.add('mobile-reading');
        }
      }

      // Reset All Filters
      function resetAllFilters() {
        state.tab = 'all';
        state.category = 'all';
        state.source = 'all';
        state.query = '';
        searchInput.value = '';
        searchClearBtn.style.display = 'none';
        categoryFilter.value = 'all';
        sourceFilter.value = 'all';

        // Update tabs active class and aria-selected
        tabs.forEach(t => {
          t.el.classList.remove('active');
          t.el.setAttribute('aria-selected', 'false');
        });
        tabAll.classList.add('active');
        tabAll.setAttribute('aria-selected', 'true');

        renderList();
      }

      // Event Listeners: Search
      searchInput.addEventListener('input', () => {
        state.query = searchInput.value;
        searchClearBtn.style.display = state.query ? 'flex' : 'none';
        renderList();
      });

      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        state.query = '';
        searchClearBtn.style.display = 'none';
        searchInput.focus();
        renderList();
      });

      // Collection Tabs
      const tabs = [
        { el: tabAll, val: 'all' },
        { el: tabManual, val: 'manual' },
        { el: tabAuto, val: 'auto' },
      ];
      tabs.forEach(({ el, val }) => {
        el.addEventListener('click', () => {
          tabs.forEach(t => {
            t.el.classList.remove('active');
            t.el.setAttribute('aria-selected', 'false');
          });
          el.classList.add('active');
          el.setAttribute('aria-selected', 'true');
          state.tab = val;
          renderList();
        });
      });

      // Category and Source
      categoryFilter.addEventListener('change', () => {
        state.category = categoryFilter.value;
        renderList();
      });

      sourceFilter.addEventListener('change', () => {
        state.source = sourceFilter.value;
        renderList();
      });

      resetFiltersBtn.addEventListener('click', resetAllFilters);

      const focusButton = document.getElementById('focus-reading-btn');
      function setFocusReading(enabled) {
        if (enabled && document.activeElement instanceof HTMLElement) document.activeElement.blur();
        document.body.classList.toggle('focus-reading', enabled);
        focusButton.setAttribute('aria-pressed', String(enabled));
        focusButton.textContent = enabled ? '返回浏览' : '专注阅读';
      }
      focusButton.addEventListener('click', () => setFocusReading(!document.body.classList.contains('focus-reading')));

      // Mobile Back Button
      mobileBackBtn.addEventListener('click', () => {
        setFocusReading(false);
        appLayout.classList.remove('mobile-reading');
      });

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
          e.preventDefault();
          setFocusReading(false);
          appLayout.classList.remove('mobile-reading');
          searchInput.focus();
        } else if (e.key === 'Escape') {
          if (document.activeElement === searchInput) {
            searchInput.blur();
          } else if (document.body.classList.contains('focus-reading')) {
            setFocusReading(false);
          } else if (appLayout.classList.contains('mobile-reading')) {
            appLayout.classList.remove('mobile-reading');
          }
        }
      });

      // Hash change listener
      window.addEventListener('hashchange', () => {
        let hash = window.location.hash;
        if (hash.startsWith('#')) {
          hash = hash.slice(1);
        }
        if (hash) {
          let decoded = null;
          try {
            decoded = decodeURIComponent(hash);
          } catch (e) {
            decoded = null;
          }
          if (decoded && decoded !== state.selectedId && articles.some(a => a.id === decoded)) {
            selectArticle(decoded, true);
          }
        }
      });

      function resetUiState() {
        state.tab = 'all';
        state.category = 'all';
        state.source = 'all';
        state.query = '';
        state.selectedId = null;
        searchInput.value = '';
        searchClearBtn.style.display = 'none';
        while (categoryFilter.options.length > 1) categoryFilter.remove(1);
        while (sourceFilter.options.length > 1) sourceFilter.remove(1);
        categoryFilter.value = 'all';
        sourceFilter.value = 'all';
        tabs.forEach(t => {
          t.el.classList.remove('active');
          t.el.setAttribute('aria-selected', 'false');
        });
        tabAll.classList.add('active');
        tabAll.setAttribute('aria-selected', 'true');
        setFocusReading(false);
        appLayout.classList.remove('mobile-reading');
      }

      function boot(nextArticles, nextLabels) {
        renderEpoch += 1;
        articles = Array.isArray(nextArticles) ? nextArticles : [];
        labels = (nextLabels && typeof nextLabels === 'object') ? nextLabels : {};
        resetUiState();
        updateCollectionCounts();
        initFilterOptions();

        // Check initial hash (ids are opaque in encrypted mode).
        let initialId = null;
        if (window.location.hash) {
          try {
            initialId = decodeURIComponent(window.location.hash.slice(1));
          } catch (e) {
            initialId = null;
          }
        }

        if (initialId && articles.some(a => a.id === initialId)) {
          state.selectedId = initialId;
          if (window.innerWidth <= 820) {
            appLayout.classList.add('mobile-reading');
          }
        } else if (articles.length > 0 && window.innerWidth > 820) {
          state.selectedId = articles[0].id;
        }

        renderList();
        if (state.selectedId) {
          renderReader(state.selectedId);
        }
      }

      function shutdown() {
        renderEpoch += 1;
        articles = [];
        labels = {};
        resetUiState();
        updateCollectionCounts();
        articleListEl.innerHTML = '';
        readerContentEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">已锁定</div>
            <div class="empty-desc">输入口令后可继续阅读。</div>
          </div>
        `;
        try {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        } catch (e) {}
      }

      window.CAContentArchive = {
        boot: boot,
        shutdown: shutdown,
        isEncrypted: encryptedMode,
        getEpoch: function() { return renderEpoch; },
      };

      if (!encryptedMode) {
        // Offline setup: the embedded JSON is the only data source.
        boot(articles, labels);
      }
    })();
  </script>
  <script src="reader.js" defer></script>
</body>
</html>
